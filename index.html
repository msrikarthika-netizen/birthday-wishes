<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Happy Birthday karthika 💗</title>
    <meta name="description" content="A special birthday surprise just for you, karthika 💖">
    <link
        href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Quicksand:wght@400;500;600;700&display=swap"
        rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Custom Cursor -->
    <div class="cursor">
        <svg viewBox="0 0 24 24">
            <path fill="#ff69b4"
                d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z" />
        </svg>
    </div>

    <!-- Particles Canvas -->
    <canvas id="particleCanvas"></canvas>

    <!-- Floating Petals -->
    <div class="petals-container" id="petals"></div>

    <div class="container">
        <!-- Decorative top stars -->
        <div class="star-row">
            <span>✨</span><span>⭐</span><span>🌟</span><span>⭐</span><span>✨</span>
        </div>

        <div class="title-wrap">
            <h1 class="main-title" id="mainTitle">Happy Birthday</h1>
            <h1 class="name-title" id="nameTitle">karthika 💗</h1>
        </div>

        <div class="greeting" id="greeting"></div>

        <div class="badge">🎂 Today is your special day! 🎂</div>

        <button class="cta-button" id="ctaBtn">
            <span class="btn-text">Click to Enter Our World 💕</span>
            <span class="btn-shine"></span>
        </button>

        <div class="bottom-emojis">
            <span class="float-em" style="--d:0s">🌸</span>
            <span class="float-em" style="--d:0.3s">💫</span>
            <span class="float-em" style="--d:0.6s">🦋</span>
            <span class="float-em" style="--d:0.9s">🌸</span>
            <span class="float-em" style="--d:1.2s">💫</span>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
